<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Album Gesture Detector</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .split {
    display: flex;
    width: 100vw;
    height: 100vh;
  }
  .pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
  }
  #placeholder {
    color: #666;
    font-family: sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
  }
  #debugHud {
    position: absolute;
    top: 8px;
    left: 8px;
    color: #7cffa0;
    font: 14px/1.4 monospace;
    white-space: pre;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="split">
    <div class="pane">
      <video id="video" playsinline muted autoplay></video>
      <div id="debugHud"></div>
    </div>
    <div class="pane">
      <div id="placeholder">Esperando gesto...</div>
      <img id="memeImg" src="" alt="" />
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
